<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#021837">
  <title>سكر زيادة | القائمة</title>
  <meta name="description" content="قائمة سكر زيادة للكريب والسناك. تصفح الأصناف واطلب مباشرة عبر واتساب.">

  <!-- Link preview on WhatsApp / Facebook.
       After hosting, replace "images/share.jpg" with the full link,
       for example: https://sukarziyada.github.io/images/share.jpg -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="سكر زيادة | Sukar Ziyada">
  <meta property="og:description" content="كريب وسناك. تصفح القائمة واطلب عبر واتساب.">
  <meta property="og:image" content="images/share.jpg">

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- Fonts and icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;600&family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Menu design -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ================= HERO ================= -->
  <header class="hero" id="hero">
    <div class="hero-actions">
      <button class="pill-btn" type="button" data-act="lang" id="langBtn">English</button>
      <button class="round-btn" type="button" data-act="share" id="shareBtn" aria-label="مشاركة">
        <i class="fa-solid fa-share-nodes"></i>
      </button>
    </div>
    <div class="coin">
      <img src="images/logo.png" alt="سكر زيادة | Sukar Ziyada" width="560" height="560">
    </div>
    <p class="status" id="status" hidden></p>
    <nav class="social" id="heroSocial" aria-label="Social"></nav>
  </header>

  <!-- ================= STICKY BAR: search, cart, sections ================= -->
  <div class="bar" id="bar">
    <div class="bar-inner">
      <div class="bar-row">
        <img class="bar-logo" src="images/logo-sm.png" alt="" width="40" height="40">
        <label class="search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input id="search" type="search" enterkeyhint="search" autocomplete="off" placeholder="ابحث عن صنف">
          <button class="search-clear" type="button" id="searchClear" aria-label="مسح" hidden>
            <i class="fa-solid fa-xmark"></i>
          </button>
        </label>
        <button class="cart-btn" type="button" data-act="open-cart" id="cartBtn" aria-label="السلة">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="badge" id="cartBadge">0</span>
        </button>
      </div>
      <div class="tabs-row">
        <button class="index-btn" type="button" data-act="open-cats" id="indexBtn" aria-label="جميع الأقسام">
          <i class="fa-solid fa-list-ul"></i>
        </button>
        <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      </div>
    </div>
  </div>

  <!-- ================= MENU (filled from js/menu-data.js) ================= -->
  <main class="menu" id="menu">
    <div id="sections"></div>
    <div id="results" hidden></div>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- ================= FLOATING ELEMENTS ================= -->
  <button class="to-top" id="toTop" type="button" data-act="to-top" aria-label="إلى الأعلى">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <button class="cart-bar" id="cartBar" type="button" data-act="open-cart">
    <span class="cart-bar-count" id="cartBarCount">0</span>
    <span class="cart-bar-label" id="cartBarLabel">عرض السلة</span>
    <span class="cart-bar-sum" id="cartBarSum"></span>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ================= PANELS ================= -->
  <div class="overlay" id="overlay" data-act="close"></div>

  <!-- Item details -->
  <section class="sheet" id="itemSheet" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="sheet-grab" aria-hidden="true"></div>
    <button class="close-btn floating" type="button" data-act="close" aria-label="إغلاق">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="sheet-body flush" id="itemBody"></div>
    <div class="sheet-foot" id="itemFoot"></div>
  </section>

  <!-- Cart -->
  <section class="sheet" id="cartSheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="cartTitle">
    <div class="sheet-grab" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 class="sheet-title" id="cartTitle">سلة الطلب</h2>
      <button class="text-btn danger" type="button" data-act="clear-cart" id="clearBtn">إفراغ السلة</button>
      <button class="close-btn" type="button" data-act="close" aria-label="إغلاق">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </header>
    <div class="sheet-body" id="cartBody"></div>
    <div class="sheet-foot" id="cartFoot"></div>
  </section>

  <!-- Checkout -->
  <section class="sheet" id="checkoutSheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="coTitle">
    <div class="sheet-grab" aria-hidden="true"></div>
    <header class="sheet-head">
      <button class="back-btn" type="button" data-act="back-cart" id="backBtn" aria-label="رجوع إلى السلة">
        <i class="fa-solid fa-arrow-right"></i>
      </button>
      <h2 class="sheet-title" id="coTitle">إتمام الطلب</h2>
      <button class="close-btn" type="button" data-act="close" aria-label="إغلاق">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </header>
    <div class="sheet-body" id="coBody"></div>
    <div class="sheet-foot" id="coFoot"></div>
  </section>

  <!-- All sections index -->
  <section class="sheet" id="catsSheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="catsTitle">
    <div class="sheet-grab" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 class="sheet-title" id="catsTitle">جميع الأقسام</h2>
      <button class="close-btn" type="button" data-act="close" aria-label="إغلاق">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </header>
    <div class="sheet-body" id="catsBody"></div>
  </section>

  <noscript>
    <p class="data-error">يرجى تفعيل JavaScript لعرض القائمة. Please enable JavaScript to view the menu.</p>
  </noscript>

  <!-- 1) Menu items and settings (the file you edit)  2) Menu logic -->
  <script src="js/menu-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
